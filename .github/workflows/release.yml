name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Lint (clippy)
        working-directory: ./src-tauri
        run: |
          cargo clippy --all-targets 2>&1 | tee clippy.log

      - name: Report lints to annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = '${{ github.workspace }}/src-tauri/clippy.log';
            const log = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            const lines = log.split('\n');
            const hits = [];
            lines.forEach((l, i) => {
              if (/^(warning|error)/.test(l)) hits.push(i);
            });
            const detail = hits.slice(0, 25).map(i =>
              lines.slice(Math.max(0, i - 1), i + 7).join('\n')
            ).join('\n---\n');
            if (detail.trim()) {
              core.error(detail.slice(0, 60000));
            }

      - name: Fail on lints
        if: always()
        working-directory: ./src-tauri
        run: |
          if grep -qE '^(warning|error)' clippy.log; then exit 1; fi

      - name: Unit tests
        working-directory: ./src-tauri
        run: cargo test

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NovaEnv ${{ github.ref_name }}"
          releaseBody: "NovaEnv desktop release."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
